# fly.toml — remote Garmin MCP server on Fly.io.
#
# BEFORE DEPLOYING:
#   1. Change `app` below to a globally unique name of your choice
#      (e.g. garmin-mcp-YOURNAME).
#   2. `flyctl apps create <name>` — reserves that app.
#   3. Optionally change `primary_region` to the region closest to you:
#      https://fly.io/docs/reference/regions/
#   4. `flyctl secrets set AUTH_TOKEN=... GARMIN_TOKENS_JSON=... OAUTH_CLIENT_ID=... OAUTH_CLIENT_SECRET=...`
#      (see README.md for the full list of required secrets).
#   5. `flyctl deploy --remote-only`.
#
# See https://fly.io/docs/reference/configuration/ for details.

app = 'garmin-mcp-CHANGE-ME'
primary_region = 'ams'

[build]
[env]
  PORT = '8000'
  TOKEN_DIR = '/data/garminconnect'

[[mounts]]
  source = 'garmin_tokens'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
